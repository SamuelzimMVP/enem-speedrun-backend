services:
  - type: web
    name: enem-speedrun-backend
    runtime: node
    startCommand: node server.js
    buildCommand: npm ci --omit=dev
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: NPM_FLAGS
        value: --prefer-offline --no-audit
